# Custom overlay config for the default4712SS_fixedcap run (planning horizon 2035)
# Apply on top of config.de.yaml (loaded automatically by the Snakefile):
#   snakemake --profile slurm --rerun-triggers mtime --keep-going \
#     results/default4712SS_fixedcap/KN2045_Mix/networks/base_s_27__none_2035_op.nc \
#     --configfile config/config_default4712SS_fixedcap_2035.yaml
#
# Purpose: fixed-capacity hourly dispatch ("operations") run on the solved
# default4712SS network for 2035. The capacities of the mixed-resolution
# investment run (4 x 28-day hourly windows + 3h base) are fixed, all time
# series are lifted to native hourly resolution (donor: this run's own
# prepare_sector_network output at 1H), and the German AC buses are merged
# into a single market zone (copperplate) so that one uniform German
# electricity price results.
#
# Only the solved source network from default4712SS must already exist; the
# donor network requires this run's resource chain at hourly resolution but
# NO solved network.

run:
  prefix: default4712SS_fixedcap

# Kept identical to the source run (default4712SS) so the donor's data
# preparation is consistent with how the source 2035 network was built.
# The requested target only builds the 2035 branch anyway.
scenario:
  planning_horizons:
  - 2025
  - 2030
  - 2035

atlite:
  nprocesses: 4

clustering:
  temporal:
    resolution_sector: false   # native hourly resolution for the dispatch network

solve_operations:
  # Solved capacity-expansion networks of the source run; the wildcards are
  # filled in from the requested target file. Any temporal resolution works.
  source_network: "results/default4712SS/KN2045_Mix/networks/base_s_{clusters}_{opts}_{sector_opts}_{planning_horizons}.nc"
  copperplate_zones:
  - ["DE"]                     # one German bidding zone
  unfix_free_stores: true
  co2_atmosphere_constraint: true

solving:
  mem_mb: 160000
  runtime: 12h
  options:
    # With capacities fixed against block-averaged profiles, single hours can
    # exceed the fixed capacities. Load shedding/sinks turn such hours into
    # scarcity prices (value of lost load) instead of infeasibilities.
    load_shedding:
      enable: true
    load_sinks:
      enable: true
      all_carriers: true
    # Fallback if the full-year hourly LP is too large in one piece:
    # rolling_horizon: true
    # horizon: 1096    # hours per window
    # overlap: 168     # hours of overlap between windows
