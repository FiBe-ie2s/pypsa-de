# Custom overlay config for the test02_fixedcap run
# Apply on top of config.de.yaml (loaded automatically by the Snakefile):
#   snakemake -call results/test02_fixedcap/KN2045_Mix/networks/base_s_27__none_2035_op.nc \
#     --configfile config/config.test02_fixedcap.yaml --rerun-triggers mtime
#
# Purpose: fixed-capacity hourly dispatch ("operations") run on the solved
# test02_custom_map networks. The capacities of the mixed-resolution
# investment run are fixed, all time series are lifted to native hourly
# resolution (donor: this run's own prepare_sector_network output at 1H),
# and the German AC buses are merged into a single market zone
# (copperplate) so that one uniform German electricity price results.
#
# The donor network requires the resources chain of this run at hourly
# resolution (renewable profiles etc.) but NO solved network - only the
# solved source network from test02_custom_map must already exist.

run:
  prefix: test02_fixedcap

scenario:
  planning_horizons:
  - 2025
  - 2030
  - 2035

atlite:
  nprocesses: 4

clustering:
  temporal:
    resolution_sector: false   # native hourly resolution for the dispatch network

solve_operations:
  # Solved capacity-expansion networks of the source run; the wildcards are
  # filled in from the requested target file. Any temporal resolution works.
  source_network: "results/test02_custom_map/KN2045_Mix/networks/base_s_{clusters}_{opts}_{sector_opts}_{planning_horizons}.nc"
  copperplate_zones:
  - ["DE"]                     # one German bidding zone
  unfix_free_stores: true
  co2_atmosphere_constraint: true

solving:
  mem_mb: 160000
  runtime: 12h
  options:
    # With capacities fixed against block-averaged profiles, single hours can
    # exceed the fixed capacities. Load shedding/sinks turn such hours into
    # scarcity prices (value of lost load) instead of infeasibilities.
    load_shedding:
      enable: true
    load_sinks:
      enable: true
      all_carriers: true
    # Fallback if the full-year hourly LP is too large in one piece:
    # rolling_horizon: true
    # horizon: 1096    # hours per window
    # overlap: 168     # hours of overlap between windows
